# SonarCloud project settings for CI-based analysis (not used by Automatic Analysis).
# Project: https://sonarcloud.io/summary/overall?id=Unnamed2964_umamichi.moe
sonar.organization=Unnamed2964
sonar.projectKey=Unnamed2964_umamichi.moe
sonar.projectName=umamichi.moe

sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.sourceEncoding=UTF-8

# Generated by: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
**/content/**,\
**/imgs/**,\
**/files/**,\
**/generated/**,\
**/*.test.ts,\
**/*.test-fixtures.ts,\
**/node_modules/**,\
**/dist/**,\
**/.astro/**

# --- Switching from Automatic Analysis to CI (manual) ---
# 1. SonarCloud → project Administration → Analysis Method: turn OFF Automatic Analysis.
#    Coverage import only works with CI-based analysis; do not run both methods.
# 2. Later CI: run `npm run test:coverage`, then SonarSource/sonarcloud-github-action
#    (or sonar-scanner) with SONAR_TOKEN. This repo does not ship that workflow yet.
